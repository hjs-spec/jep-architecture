<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="350" viewBox="0 0 1120 350" role="img" aria-labelledby="title desc">
  <title id="title">Execution Path Diagram</title>
  <desc id="desc">Static SVG preview generated from the repository architecture diagram definitions.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#394150" />
    </marker>
    <style>
      .title { font: 700 22px Arial, sans-serif; fill: #172033; }
      .box { rx: 12; ry: 12; stroke-width: 1.7; }
      .protocol { fill: #e8f1ff; stroke: #2f6fed; }
      .runtime { fill: #edf8f0; stroke: #2c8a4a; }
      .archive { fill: #fff7e6; stroke: #d99000; }
      .external { fill: #fff0f0; stroke: #d64545; }
      .label { font: 700 15px Arial, sans-serif; fill: #172033; }
      .small { font: 12px Arial, sans-serif; fill: #394150; }
      .edge { stroke: #394150; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 6 5; }
    </style>
  </defs>
  <text x="560" y="38" text-anchor="middle" class="title">Execution Path: Agent Runtime → JEP Middleware → Tool Execution → Archive → Replay</text>
  <rect x="40" y="115" width="180" height="82" class="box runtime" />
  <text x="130.0" y="143" text-anchor="middle" class="label">Agent Runtime</text>
  <text x="130.0" y="161" text-anchor="middle" class="small">receives task + context</text>
  <path d="M 220 156.0 L 264 156.0" class="edge" />
  <rect x="270" y="115" width="180" height="82" class="box protocol" />
  <text x="360.0" y="143" text-anchor="middle" class="label">JEP Middleware</text>
  <text x="360.0" y="161" text-anchor="middle" class="small">creates envelope</text>
  <path d="M 450 156.0 L 494 156.0" class="edge" />
  <rect x="500" y="115" width="180" height="82" class="box runtime" />
  <text x="590.0" y="143" text-anchor="middle" class="label">Tool Execution</text>
  <text x="590.0" y="161" text-anchor="middle" class="small">validates HJS, runs tool</text>
  <path d="M 680 156.0 L 724 156.0" class="edge" />
  <rect x="730" y="115" width="180" height="82" class="box archive" />
  <text x="820.0" y="143" text-anchor="middle" class="label">Archive</text>
  <text x="820.0" y="161" text-anchor="middle" class="small">writes JAC record</text>
  <path d="M 910 156.0 L 954 156.0" class="edge" />
  <rect x="960" y="115" width="180" height="82" class="box archive" />
  <text x="1050.0" y="143" text-anchor="middle" class="label">Replay</text>
  <text x="1050.0" y="161" text-anchor="middle" class="small">reconstructs path</text>
  <path d="M 1050.0 197 C 780 310, 260 310, 130.0 197" class="edge dash" />
  <text x="560" y="300" text-anchor="middle" class="small">debug / verify / reproduce from replay back into runtime investigation</text>
</svg>
