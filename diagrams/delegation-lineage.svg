  <path d="M 260 190 L 215 190" class="edge" />
  <text x="237.5" y="182.0" text-anchor="middle" class="small">evidence</text>
  <rect x="475" y="125" width="165" height="82" class="box protocol" />
  <text x="557.5" y="153" text-anchor="middle" class="label">Sub-Agent</text>
  <text x="557.5" y="171" text-anchor="middle" class="small">bounded task</text>
